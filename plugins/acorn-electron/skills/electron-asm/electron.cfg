# ld65 configuration for a machine code program for the Acorn Electron.
# Build:  cl65 -t none -C electron.cfg --start-addr 0x0E00 -o prog.bin prog.s
# The start address is where the program is loaded and run; &0E00 is PAGE.
# Zero page &70-&8F is free for the user's own programs.
MEMORY {
    ZP:   start = $0070, size = $0020, type = rw, define = yes;
    MAIN: start = %S,    size = $5800 - %S, type = rw, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp,  optional = yes;
    CODE:     load = MAIN, type = rw;
    RODATA:   load = MAIN, type = ro,  optional = yes;
    DATA:     load = MAIN, type = rw,  optional = yes;
    BSS:      load = MAIN, type = bss, optional = yes, define = yes;
}

# Builds the emulator on Windows, Linux and macOS, and keeps what is built as a
# download with the run (under "Artifacts" on the page of the run).
#
# A tag that starts with v (v1.0.0, v1.1.0 ...) makes a release as well, with the
# three programs attached:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# The ROMs are not in the repository, so they are not in what is built either;
# where the program looks for them is in the README, under "The ROMs".

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-24.04
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}

    # the version in the names of the files: the tag, or else "dev"
    env:
      PACKAGE: acornelectron-${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}-${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxtst-dev libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev \
            libpulse-dev libudev-dev libdbus-1-dev

      - name: ROMs
        shell: bash
        run: mkdir -p roms

      # SDL3 and zlib downloaded and built in everywhere, so that the program
      # does not depend on what happens to be installed on the build machine
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEMULATOR_DOWNLOAD_DEPENDENCIES=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      # a zip for Windows; a tar for Linux and macOS, as it keeps the program
      # executable, which a zip does not
      - name: Package
        shell: bash
        run: |
          mkdir -p package/acornelectron dist
          cp README.md package/acornelectron/
          case "${{ matrix.name }}" in
            windows)
              cp build/Release/acornelectron.exe package/acornelectron/
              cp build/Release/*.dll package/acornelectron/ 2>/dev/null || true
              (cd package && 7z a -tzip "../dist/$PACKAGE.zip" acornelectron) ;;
            linux)
              cp build/acornelectron package/acornelectron/
              tar -C package -czf "dist/$PACKAGE.tar.gz" acornelectron ;;
            macos)
              cp -R "build/Acorn Electron.app" package/acornelectron/
              tar -C package -czf "dist/$PACKAGE.tar.gz" acornelectron ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: dist/*

  release:
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          ## Downloads

          | System | File |
          |---|---|
          | Windows (64-bit) | `acornelectron-*-windows.zip` |
          | macOS (Apple Silicon) | `acornelectron-*-macos.tar.gz` |
          | Linux (x86-64) | `acornelectron-*-linux.tar.gz` |

          ## The ROMs

          The ROMs of the Electron are not included. Put `os.rom` and `basic.rom`
          (16 kB each) in a folder `roms` next to the program, or in:

          - Windows: `%APPDATA%\Emulators\acornelectron\roms`
          - macOS: `~/Library/Application Support/Emulators/acornelectron/roms`
          - Linux: `~/.local/share/Emulators/acornelectron/roms`

          If they are missing, the emulator says where to put them and makes the
          last of these folders.

          ## macOS

          The application is not signed by a known developer, so macOS stops it the
          first time. Right-click it and choose Open, or run
          `xattr -dr com.apple.quarantine "Acorn Electron.app"`.
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Acorn Electron $TAG" --notes-file notes.md --generate-notes

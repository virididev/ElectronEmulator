# Builds the emulator on Windows, Linux and macOS, to see that it still does.
# The ROMs are not in the repository, so the build makes do without them.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxtst-dev libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev \
            libpulse-dev libudev-dev libdbus-1-dev

      - name: ROMs
        shell: bash
        run: mkdir -p roms

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel
